<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the group chat, but it never sleeps</title>
<style>
  :root {
    --paper: #EFEDE7;
    --ink: #1B1B1F;
    --ink-soft: #55555C;
    --line: #D8D4C9;
    --accent: #3F6D5D;
    --accent-soft: #E4EDE9;
    --bubble: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  main {
    width: 100%;
    max-width: 640px;
    padding: 24px 20px 40px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin: 0 0 28px;
    line-height: 1.4;
  }

  /* --- Lock screen --- */
  #lock {
    display: flex;
    flex-direction: column;
    gap: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    background: var(--bubble);
  }
  #lock label { font-size: 0.9rem; color: var(--ink-soft); }
  #passphrase {
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 1rem;
  }
  button {
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status {
    font-size: 0.85rem;
    color: var(--ink-soft);
    min-height: 1.2em;
  }
  #error { color: #B03A2E; font-size: 0.9rem; }

  /* --- Chat --- */
  #chat-screen { display: none; flex-direction: column; flex: 1; }
  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px 0 16px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 0.97rem;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .msg.typing { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
  .msg.typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .msg.typing span:nth-child(2) { animation-delay: 0.15s; }
  .msg.typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  #persona-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 12px;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }
  #persona-select {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 0.9rem;
    background: var(--bubble);
  }
  #input:disabled, #composer button:disabled { opacity: 0.6; }
  form#composer {
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }
  #input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 1rem;
  }
</style>
</head>
<body>
<main>
  <h1>the group chat, but it never sleeps</h1>
  <p class="subtitle">Trained on nothing except a year of us being unhinged in a Messenger thread. Ask it anything.</p>

  <div id="lock">
    <label for="passphrase">This is locked. Enter the passphrase you were given.</label>
    <input id="passphrase" type="password" placeholder="passphrase" autocomplete="off">
    <button id="unlock-btn">Unlock</button>
    <div id="status"></div>
    <div id="error"></div>
  </div>

  <div id="chat-screen">
    <div id="persona-bar">
      <label for="persona-select">Reply as:</label>
      <select id="persona-select">
        <option value="">Anyone (whole group)</option>
      </select>
    </div>
    <div id="messages"></div>
    <form id="composer">
      <input id="input" type="text" placeholder="Say something to the group..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>
</main>

<script type="module">
  import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

  // Must match encrypt.mjs
  const PBKDF2_ITERATIONS = 250000;
  const DATA_FILE = "encrypted.json";

  // Pick a small-ish model so it loads reasonably fast in-browser.
  // Check the WebLLM model list for current options/names before deploying:
  // https://github.com/mlc-ai/web-llm
  const MODEL_ID = "Llama-3.2-3B-Instruct-q4f32_1-MLC";

  let chatLog = null;
  let engine = null;

  const $ = (id) => document.getElementById(id);

  function base64ToBytes(b64) {
    return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  }

  async function deriveKey(passphrase, saltBytes) {
    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(passphrase),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function decryptChatLog(passphrase) {
    const res = await fetch(DATA_FILE);
    if (!res.ok) throw new Error("Could not load encrypted.json");
    const { salt, iv, ciphertext } = await res.json();

    const key = await deriveKey(passphrase, base64ToBytes(salt));
    const plainBuf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: base64ToBytes(iv) },
      key,
      base64ToBytes(ciphertext)
    );
    return JSON.parse(new TextDecoder().decode(plainBuf));
  }

  // The model's context window (Llama-3.2-3B here runs at ~4k tokens) sets
  // the ceiling. Rough budget: ~700 tokens for the system instructions +
  // conversation history, leaving room for ~90 short chat messages as
  // context plus the reply itself. Drop this if replies feel slow, or the
  // model starts ignoring the start of the context.
  const CONTEXT_MESSAGE_LIMIT = 40;

  // Very simple retrieval: score each message by keyword overlap with the
  // question, return the most relevant ones as context. Good enough for a
  // group chat's worth of data without needing a vector database.
  // If senderFilter is set, only that person's own messages are considered.
  function findRelevantMessages(query, messages, senderFilter, limit = CONTEXT_MESSAGE_LIMIT) {
    const pool = senderFilter ? messages.filter((m) => m.sender === senderFilter) : messages;
    const queryWords = query.toLowerCase().split(/\W+/).filter(Boolean);
    const scored = pool.map((m) => {
      const text = (m.text || "").toLowerCase();
      const keywordScore = queryWords.reduce((n, w) => n + (text.includes(w) ? 1 : 0), 0);
      // Small bonus for longer messages — one-word replies like "lol" carry
      // almost no style signal, so nudge more characterful ones to the top.
      const lengthBonus = Math.min(text.length / 40, 2);
      return { m, score: keywordScore + lengthBonus * (keywordScore > 0 ? 1 : 0.01) };
    });
    scored.sort((a, b) => b.score - a.score);
    const matched = scored.filter((s) => s.score > 0.01).slice(0, limit).map((s) => s.m);
    if (matched.length >= Math.min(10, limit)) return matched;
    // Not enough keyword matches — fall back to their most characterful
    // recent messages instead of just "last N chronologically."
    const byLength = [...pool].sort((a, b) => (b.text || "").length - (a.text || "").length);
    return byLength.slice(0, limit);
  }

  // Backup net: strip common AI self-disclosure phrases if the model
  // ignores the system prompt's instruction not to use them.
  function stripAiDisclaimers(text) {
    return text
      .replace(/^(as an ai|as a language model|i'm an ai|i am an ai)[^.!?]*[.!?]\s*/gi, "")
      .replace(/\(?(note|disclaimer):[^)]*\)?\s*/gi, "")
      .trim() || text; // never return an empty string
  }

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.textContent = text;
    $("messages").appendChild(div);
    $("messages").scrollTop = $("messages").scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "msg bot typing";
    div.id = "typing-indicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    $("messages").appendChild(div);
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  function hideTyping() {
    const el = $("typing-indicator");
    if (el) el.remove();
  }

  function populatePersonaSelect(messages) {
    const names = [...new Set(messages.map((m) => m.sender))].sort();
    const select = $("persona-select");
    for (const name of names) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    }
  }

  async function handleUnlock() {
    const passphrase = $("passphrase").value;
    if (!passphrase) return;

    $("unlock-btn").disabled = true;
    $("error").textContent = "";
    $("status").textContent = "Decrypting...";

    try {
      chatLog = await decryptChatLog(passphrase);
      populatePersonaSelect(chatLog);
    } catch (e) {
      $("error").textContent = "Wrong passphrase, or the data didn't decrypt. Try again.";
      $("unlock-btn").disabled = false;
      $("status").textContent = "";
      return;
    }

    $("status").textContent = "Loading the model into your browser (first time is slower)...";

    engine = await CreateMLCEngine(MODEL_ID, {
      initProgressCallback: (p) => {
        $("status").textContent = p.text || "Loading model...";
      },
    });

    $("status").textContent = "";
    $("lock").style.display = "none";
    $("chat-screen").style.display = "flex";
    addMessage("Loaded. Ask away.", "bot");
  }

  async function handleSend(e) {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text || !engine) return;

    const selectedPerson = $("persona-select").value; // "" means anyone

    addMessage(text, "user");
    $("input").value = "";
    $("input").disabled = true;
    $("composer").querySelector("button").disabled = true;
    showTyping();

    try {
      const context = findRelevantMessages(text, chatLog, selectedPerson)
        .map((m) => `${m.sender}: ${m.text}`)
        .join("\n");

      const noBreakingCharacter =
        "Everyone in this chat already knows this is a simulation for fun — never say you are an AI, " +
        "a language model, an assistant, or a chatbot, and never add disclaimers, caveats, or " +
        "reminders that this isn't real. Just reply in character, like a normal chat message.";

      const systemPrompt = selectedPerson
        ? `You are ${selectedPerson}, a real person, replying in a private group chat. Below are ` +
          `real messages ${selectedPerson} actually sent. Study their exact word choices, slang, ` +
          `punctuation, capitalization, and typical message length, and reply exactly the way they ` +
          `would — don't write a polished or generic sentence. Reply only as ${selectedPerson}, one ` +
          `short message, nothing else. ${noBreakingCharacter}\n\n` +
          `${selectedPerson}'s actual messages:\n${context}`
        : "You are role-playing as the participants of a private group chat, based on real message " +
          "excerpts below. Match their tone, humor, and speech patterns. Keep replies short, like a " +
          `real chat message, not an essay. ${noBreakingCharacter}\n\nExcerpts:\n` + context;

      const reply = await Promise.race([
        engine.chat.completions.create({
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: text },
          ],
        }),
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error("timeout")), 120000)
        ),
      ]);

      hideTyping();
      addMessage(stripAiDisclaimers(reply.choices[0].message.content), "bot");
    } catch (err) {
      console.error("Generation failed:", err);
      hideTyping();
      const msg = err.message === "timeout"
        ? "That's taking too long (2+ min) — your browser may not have WebGPU support, or your GPU is struggling with this model. Check the console (F12) for details."
        : "Something went wrong generating that reply — try again.";
      addMessage(msg, "bot");
    } finally {
      $("input").disabled = false;
      $("composer").querySelector("button").disabled = false;
      $("input").focus();
    }
  }

  $("unlock-btn").addEventListener("click", handleUnlock);
  $("composer").addEventListener("submit", handleSend);
</script>
</body>
</html>
