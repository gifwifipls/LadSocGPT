<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the group chat, but it never sleeps</title>
<style>
  :root {
    --paper: #EFEDE7;
    --ink: #1B1B1F;
    --ink-soft: #55555C;
    --line: #D8D4C9;
    --accent: #3F6D5D;
    --accent-soft: #E4EDE9;
    --bubble: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  main {
    width: 100%;
    max-width: 640px;
    padding: 24px 20px 20px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh; /* mobile browsers: exclude the address bar */
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin: 0 0 28px;
    line-height: 1.4;
  }

  /* --- Lock screen --- */
  #lock {
    display: flex;
    flex-direction: column;
    gap: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    background: var(--bubble);
  }
  #lock label { font-size: 0.9rem; color: var(--ink-soft); }
  #passphrase {
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 1rem;
  }
  button {
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status {
    font-size: 0.85rem;
    color: var(--ink-soft);
    min-height: 1.2em;
  }
  #error { color: #B03A2E; font-size: 0.9rem; }

  /* --- Chat --- */
  #chat-screen { display: none; flex-direction: column; flex: 1; min-height: 0; }
  #messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px 0 16px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 0.97rem;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .msg.typing { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
  .msg.typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .msg.typing span:nth-child(2) { animation-delay: 0.15s; }
  .msg.typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  body.chatting .subtitle { display: none; }
  body.chatting h1 { font-size: 1.15rem; margin-bottom: 12px; }
  .msg.note {
    align-self: center;
    max-width: 100%;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 0.8rem;
    padding: 2px 8px;
  }
  .msg .who { font-size: 0.75rem; color: var(--ink-soft); margin-bottom: 2px; }
  #persona-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 12px;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }
  #persona-select {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 0.9rem;
    background: var(--bubble);
  }
  #input:disabled, #composer button:disabled { opacity: 0.6; }
  form#composer {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }
  #input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 1rem;
  }
</style>
</head>
<body>
<main>
  <h1>the group chat, but it never sleeps</h1>
  <p class="subtitle">Trained on nothing except a year of us being unhinged in a Messenger thread. Ask it anything.</p>

  <div id="lock">
    <label for="passphrase">This is locked. Enter the passphrase you were given.</label>
    <input id="passphrase" type="password" placeholder="passphrase" autocomplete="off">
    <button id="unlock-btn">Unlock</button>
    <div id="status"></div>
    <div id="error"></div>
  </div>

  <div id="chat-screen">
    <div id="persona-bar">
      <label for="persona-select">Reply as:</label>
      <select id="persona-select">
        <option value="">Anyone (whole group)</option>
      </select>
    </div>
    <div id="messages"></div>
    <form id="composer">
      <input id="input" type="text" placeholder="Say something to the group..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>
</main>

<script type="module">
  import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

  // Must match encrypt.mjs
  const PBKDF2_ITERATIONS = 250000;
  const DATA_FILE = "encrypted.json";

  // Pick a small-ish model so it loads reasonably fast in-browser.
  // Check the WebLLM model list for current options/names before deploying:
  // https://github.com/mlc-ai/web-llm
  const MODEL_ID = "Llama-3.2-3B-Instruct-q4f16_1-MLC";

  let chatLog = null;
  let engine = null;
  let hasGeneratedOnce = false;
  let gpuLost = false;
  let liveHistory = []; // recent lines of the live conversation, for follow-ups

  const $ = (id) => document.getElementById(id);

  function base64ToBytes(b64) {
    return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  }

  async function deriveKey(passphrase, saltBytes) {
    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(passphrase),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function decryptChatLog(passphrase) {
    const res = await fetch(DATA_FILE);
    if (!res.ok) throw new Error("Could not load encrypted.json");
    const { salt, iv, ciphertext } = await res.json();

    const key = await deriveKey(passphrase, base64ToBytes(salt));
    const plainBuf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: base64ToBytes(iv) },
      key,
      base64ToBytes(ciphertext)
    );
    return JSON.parse(new TextDecoder().decode(plainBuf));
  }

  // ---- Exchange-based retrieval -------------------------------------------
  // Instead of showing the model random lines, we find past moments where
  // someone said something similar to the user's message, and show what the
  // chosen person actually REPLIED. The prompt ends with "Name:" so the model
  // just continues the pattern. Keep everything small: big prompts hang the
  // GPU on Windows (DEVICE_HUNG).
  const EXCHANGE_COUNT = 6;            // example exchanges shown to the model
  const MAX_LINE_CHARS = 140;          // each line truncated to this
  const MAX_REPLY_CHARS = 140;         // only use short/medium replies as examples
  const MAX_EXAMPLES_CHARS = 1800;     // hard cap on all example text (~450 tokens)
  const REPLY_WINDOW_MS = 10 * 60 * 1000; // a "reply" must follow within 10 min
  const HISTORY_LINES = 4;             // recent live-chat lines to include

  const STOPWORDS = new Set(("the and you for are but not was this that with have just like what when who " +
    "how why can get got its it's i'm dont don't your they them then there their about from out all one " +
    "has had were been will would could should did does yes yeah okay lol haha").split(" "));

  let exchanges = [];          // [{ context: [msg, msg], reply: msg, tokens: Set }]
  let docFreq = new Map();     // word -> number of exchanges whose context has it

  function tokenize(text) {
    return (String(text || "").toLowerCase().match(/[\p{L}\p{N}']+/gu) || [])
      .filter((w) => w.length > 2 && !STOPWORDS.has(w));
  }

  function clip(text, n) {
    const t = String(text || "").replace(/\s+/g, " ").trim();
    return t.length > n ? t.slice(0, n) + "…" : t;
  }

  // Run once after decryption. Pairs each message with what it was replying to.
  function buildExchangeIndex(messages) {
    exchanges = [];
    docFreq = new Map();
    for (let i = 1; i < messages.length; i++) {
      const reply = messages[i];
      const prev = messages[i - 1];
      const replyText = String(reply.text || "").trim();
      if (replyText.length < 3 || replyText.length > MAX_REPLY_CHARS) continue;
      if (!prev || prev.sender === reply.sender) continue;        // must answer someone else
      if (reply.timestamp - prev.timestamp > REPLY_WINDOW_MS) continue; // too long a gap
      const context = [prev];
      const prev2 = messages[i - 2];
      if (prev2 && prev.timestamp - prev2.timestamp <= REPLY_WINDOW_MS) context.unshift(prev2);
      const tokens = new Set(tokenize(context.map((c) => c.text).join(" ")));
      for (const t of tokens) docFreq.set(t, (docFreq.get(t) || 0) + 1);
      exchanges.push({ context, reply, tokens });
    }
  }

  // Returns the best-matching exchanges (best match LAST, since models weigh
  // the end of the prompt most) plus a suggested replier for "Anyone" mode.
  function pickExchanges(query, personFilter) {
    const pool = personFilter ? exchanges.filter((e) => e.reply.sender === personFilter) : exchanges;
    const qTokens = [...new Set(tokenize(query))];
    const total = exchanges.length || 1;

    const scored = [];
    if (qTokens.length) {
      for (const e of pool) {
        let score = 0;
        // rare words (e.g. "airbnb") count for more than common ones
        for (const t of qTokens) if (e.tokens.has(t)) score += Math.log(1 + total / (docFreq.get(t) || 1));
        if (score > 0) scored.push({ e, score });
      }
      scored.sort((a, b) => b.score - a.score);
    }
    const matched = scored.slice(0, EXCHANGE_COUNT).map((x) => x.e); // best first

    // Pad with random exchanges so there's always some style to copy.
    const padding = [];
    if (matched.length < EXCHANGE_COUNT) {
      const used = new Set(matched);
      const rest = pool.filter((e) => !used.has(e));
      const need = Math.min(EXCHANGE_COUNT - matched.length, rest.length);
      for (let i = 0; i < need; i++) {
        const j = i + Math.floor(Math.random() * (rest.length - i));
        [rest[i], rest[j]] = [rest[j], rest[i]];
        padding.push(rest[i]);
      }
    }

    // Who should answer in "Anyone" mode? Whoever most often replied in the matches.
    let suggested = null;
    const pickFrom = matched.length ? matched : padding;
    if (pickFrom.length) {
      const counts = new Map();
      for (const e of pickFrom) counts.set(e.reply.sender, (counts.get(e.reply.sender) || 0) + 1);
      let bestN = 0;
      for (const e of pickFrom) {
        const n = counts.get(e.reply.sender);
        if (n > bestN) { bestN = n; suggested = e.reply.sender; }
      }
    }

    return { examples: [...padding, ...matched.reverse()], suggested };
  }

  function formatExamples(examples) {
    const blocks = examples.map((e) =>
      [...e.context, e.reply].map((m) => `${m.sender}: ${clip(m.text, MAX_LINE_CHARS)}`).join("\n")
    );
    // Over budget? Drop the least relevant (first) exchanges until it fits.
    while (blocks.length > 1 && blocks.join("\n\n").length > MAX_EXAMPLES_CHARS) blocks.shift();
    return blocks.join("\n\n");
  }

  function escapeRegExp(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  // Model sometimes writes "Sam: ..." itself, or keeps going on a new line.
  function cleanReply(raw, name) {
    let t = String(raw).replace(/^\s+/, "");
    t = t.replace(new RegExp("^" + escapeRegExp(name) + "\\s*:\\s*", "i"), "");
    t = t.split("\n")[0];
    return stripAiDisclaimers(t).trim();
  }

  // Backup net: strip common AI self-disclosure phrases if the model
  // ignores the system prompt's instruction not to use them.
  function stripAiDisclaimers(text) {
    return text
      .replace(/^(as an ai|as a language model|i'm an ai|i am an ai)[^.!?]*[.!?]\s*/gi, "")
      .replace(/\(?(note|disclaimer):[^)]*\)?\s*/gi, "")
      .trim() || text; // never return an empty string
  }

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.textContent = text;
    $("messages").appendChild(div);
    $("messages").scrollTop = $("messages").scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "msg bot typing";
    div.id = "typing-indicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    $("messages").appendChild(div);
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  function hideTyping() {
    const el = $("typing-indicator");
    if (el) el.remove();
  }

  function populatePersonaSelect(messages) {
    const names = [...new Set(messages.map((m) => m.sender))].sort();
    const select = $("persona-select");
    for (const name of names) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    }
  }

  async function handleUnlock() {
    const passphrase = $("passphrase").value;
    if (!passphrase) return;

    $("unlock-btn").disabled = true;
    $("error").textContent = "";
    $("status").textContent = "Decrypting...";

    try {
      chatLog = await decryptChatLog(passphrase);
      populatePersonaSelect(chatLog);
      buildExchangeIndex(chatLog);
    } catch (e) {
      $("error").textContent = "Wrong passphrase, or the data didn't decrypt. Try again.";
      $("unlock-btn").disabled = false;
      $("status").textContent = "";
      return;
    }

    $("status").textContent = "Loading the model into your browser (first time is slower)...";

    engine = await CreateMLCEngine(MODEL_ID, {
      initProgressCallback: (p) => {
        $("status").textContent = p.text || "Loading model...";
      },
    });

    $("status").textContent = "";
    $("lock").style.display = "none";
    $("chat-screen").style.display = "flex";
    document.body.classList.add("chatting");
    addMessage("Loaded. Ask away.", "bot");
  }

  async function handleSend(e) {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text || !engine) return;

    const selectedPerson = $("persona-select").value; // "" means anyone

    addMessage(text, "user");
    $("input").value = "";
    $("input").disabled = true;
    $("composer").querySelector("button").disabled = true;
    $("persona-select").disabled = true;
    showTyping();
    let warmupNote = null;
    if (!hasGeneratedOnce) {
      warmupNote = addMessage("First reply includes a one-time GPU warm-up and can take a few minutes. Later replies will be much faster.", "bot");
      warmupNote.style.fontSize = "0.85rem";
      warmupNote.style.color = "var(--ink-soft)";
    }

    try {
      const { examples, suggested } = pickExchanges(text, selectedPerson);
      const replier = selectedPerson || suggested || "a friend";
      const examplesText = formatExamples(examples);
      const recent = liveHistory.slice(-HISTORY_LINES).join("\n");

      const systemPrompt =
        `You write the next message in a private group chat of friends, exactly as ${replier} would: ` +
        `same slang, tone, punctuation and length. Reply with one short chat message only, no ` +
        `explanation. Everyone knows this is a fun simulation, so never mention being an AI.`;

      const userPrompt =
        (examplesText ? `Real past exchanges from this chat:\n\n${examplesText}\n\n` : "") +
        `Now the chat continues:\n` +
        (recent ? recent + "\n" : "") +
        `You: ${clip(text, 300)}\n${replier}:`;

      console.log(`Prompt size: ${systemPrompt.length + userPrompt.length} chars, ${examples.length} example exchanges`);

      let botBubble = null;
      let bodyEl = null;
      let fullText = "";
      let cleaned = "";
      // The first generation after load includes one-time GPU shader compilation,
      // which can take minutes on weaker GPUs. Later replies are fast.
      const STALL_LIMIT_MS = hasGeneratedOnce ? 45000 : 300000;

      const stream = await Promise.race([
        engine.chat.completions.create({
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: userPrompt },
          ],
          stream: true,
          max_tokens: 80,
          temperature: 0.9,
          top_p: 0.95,
          stop: ["\n"], // one chat message, then stop
        }),
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error("stalled-prefill")), STALL_LIMIT_MS)
        ),
      ]);

      const iterator = stream[Symbol.asyncIterator]();
      while (true) {
        const next = await Promise.race([
          iterator.next(),
          new Promise((_, reject) => setTimeout(() => reject(new Error("stalled")), STALL_LIMIT_MS)),
        ]);
        if (next.done) break;

        const delta = next.value.choices[0]?.delta?.content || "";
        if (!delta) continue;
        fullText += delta;
        cleaned = cleanReply(fullText, replier);
        if (!cleaned) continue; // nothing visible yet (e.g. only "Sam:" so far)

        if (!botBubble) {
          hideTyping();
          botBubble = addMessage("", "bot");
          const who = document.createElement("div");
          who.className = "who";
          who.textContent = replier;
          bodyEl = document.createElement("div");
          botBubble.append(who, bodyEl);
        }
        bodyEl.textContent = cleaned;
        $("messages").scrollTop = $("messages").scrollHeight;
      }

      if (!cleaned.trim()) throw new Error("empty");
      liveHistory.push(`You: ${clip(text, 300)}`, `${replier}: ${clip(cleaned, 200)}`);
      hasGeneratedOnce = true;
    } catch (err) {
      hideTyping();
      console.error("Generation failed:", err);
      const disposed = String(err.message).includes("disposed");
      if (disposed) {
        gpuLost = true;
        $("input").placeholder = "GPU connection lost, refresh the page to continue";
      }
      const msg = disposed
        ? "The GPU connection was lost (Windows reset the graphics driver). Refresh the page and unlock again."
        : err.message === "stalled" || err.message === "stalled-prefill"
        ? "Generation stalled — your GPU may be struggling with this much context on this model. Try a smaller model or fewer context messages."
        : "Something went wrong generating that reply — try again.";
      addMessage(msg, "bot");

      if (err.message === "stalled" || err.message === "stalled-prefill") {
        try {
          await engine.interruptGenerate();
        } catch (_) {
          // best-effort — some engine states can't be interrupted cleanly
        }
      }
    } finally {
      if (warmupNote) warmupNote.remove();
      $("persona-select").disabled = false;
      if (!gpuLost) {
        $("input").disabled = false;
        $("composer").querySelector("button").disabled = false;
        $("input").focus();
      }
    }
  }

  $("unlock-btn").addEventListener("click", handleUnlock);
  $("composer").addEventListener("submit", handleSend);
  $("persona-select").addEventListener("change", () => {
    liveHistory = []; // forget the previous persona's conversation
    const who = $("persona-select").value || "Anyone (whole group)";
    addMessage(`Switched to ${who}. Conversation context cleared.`, "note");
    $("input").focus();
  });
</script>
</body>
</html>
